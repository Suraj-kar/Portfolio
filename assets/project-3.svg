<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="p3bg" x1="0" y1="0" x2="600" y2="400">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p3bg)"/>
  <!-- Dashboard frame -->
  <rect x="30" y="20" width="540" height="360" rx="14" fill="#12121a" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <!-- Top nav -->
  <rect x="30" y="20" width="540" height="45" rx="14" fill="#0f0f1a"/>
  <rect x="50" y="38" width="100" height="8" rx="4" fill="#06b6d4" opacity="0.5"/>
  <!-- Donut chart -->
  <circle cx="180" cy="200" r="70" fill="none" stroke="#1a1a25" stroke-width="20"/>
  <circle cx="180" cy="200" r="70" fill="none" stroke="#6366f1" stroke-width="20" stroke-dasharray="180 260" stroke-dashoffset="0" transform="rotate(-90 180 200)"/>
  <circle cx="180" cy="200" r="70" fill="none" stroke="#8b5cf6" stroke-width="20" stroke-dasharray="100 340" stroke-dashoffset="-180" transform="rotate(-90 180 200)"/>
  <circle cx="180" cy="200" r="70" fill="none" stroke="#06b6d4" stroke-width="20" stroke-dasharray="60 380" stroke-dashoffset="-280" transform="rotate(-90 180 200)"/>
  <text x="180" y="205" text-anchor="middle" fill="#f0f0f5" font-size="22" font-weight="700" font-family="Inter, sans-serif">84%</text>
  <!-- Bar chart -->
  <g transform="translate(320, 130)">
    <rect x="0" y="80" width="30" height="90" rx="4" fill="#6366f1" opacity="0.7"/>
    <rect x="45" y="50" width="30" height="120" rx="4" fill="#8b5cf6" opacity="0.7"/>
    <rect x="90" y="30" width="30" height="140" rx="4" fill="#06b6d4" opacity="0.7"/>
    <rect x="135" y="60" width="30" height="110" rx="4" fill="#6366f1" opacity="0.5"/>
    <rect x="180" y="20" width="30" height="150" rx="4" fill="#8b5cf6" opacity="0.6"/>
    <rect x="225" y="45" width="30" height="125" rx="4" fill="#06b6d4" opacity="0.5"/>
  </g>
  <!-- Metric row -->
  <rect x="50" y="310" width="120" height="50" rx="8" fill="#1a1a25"/>
  <rect x="60" y="322" width="60" height="5" rx="2" fill="#06b6d4" opacity="0.6"/>
  <rect x="60" y="335" width="90" height="14" rx="3" fill="#6366f1" opacity="0.3"/>
  <rect x="190" y="310" width="120" height="50" rx="8" fill="#1a1a25"/>
  <rect x="200" y="322" width="60" height="5" rx="2" fill="#8b5cf6" opacity="0.6"/>
  <rect x="200" y="335" width="90" height="14" rx="3" fill="#8b5cf6" opacity="0.3"/>
  <rect x="330" y="310" width="120" height="50" rx="8" fill="#1a1a25"/>
  <rect x="340" y="322" width="60" height="5" rx="2" fill="#6366f1" opacity="0.6"/>
  <rect x="340" y="335" width="90" height="14" rx="3" fill="#06b6d4" opacity="0.3"/>
</svg>
