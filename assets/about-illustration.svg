<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="500" y2="400">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="300" y2="200">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" rx="20" fill="url(#bg1)"/>
  <!-- Desk -->
  <rect x="80" y="280" width="340" height="8" rx="4" fill="#2a2a3e"/>
  <!-- Monitor -->
  <rect x="150" y="120" width="200" height="140" rx="12" fill="url(#screen)" stroke="#6366f1" stroke-width="2"/>
  <rect x="160" y="130" width="180" height="110" rx="6" fill="#0f0f1a"/>
  <!-- Code lines -->
  <rect x="175" y="145" width="80" height="4" rx="2" fill="#6366f1" opacity="0.8"/>
  <rect x="175" y="155" width="120" height="4" rx="2" fill="#8b5cf6" opacity="0.6"/>
  <rect x="175" y="165" width="60" height="4" rx="2" fill="#06b6d4" opacity="0.7"/>
  <rect x="175" y="175" width="100" height="4" rx="2" fill="#6366f1" opacity="0.5"/>
  <rect x="175" y="185" width="90" height="4" rx="2" fill="#8b5cf6" opacity="0.4"/>
  <rect x="175" y="195" width="70" height="4" rx="2" fill="#06b6d4" opacity="0.6"/>
  <!-- Monitor stand -->
  <rect x="235" y="260" width="30" height="20" rx="2" fill="#2a2a3e"/>
  <rect x="215" y="278" width="70" height="6" rx="3" fill="#2a2a3e"/>
  <!-- Floating elements -->
  <circle cx="100" cy="100" r="20" fill="url(#accent)" opacity="0.3"/>
  <circle cx="400" cy="80" r="15" fill="#06b6d4" opacity="0.2"/>
  <rect x="380" y="200" width="40" height="40" rx="8" fill="url(#accent)" opacity="0.15" transform="rotate(15 400 220)"/>
  <!-- 3D cube wireframe -->
  <g transform="translate(60, 180)" opacity="0.4">
    <path d="M0 30 L20 15 L50 15 L30 30 Z" fill="none" stroke="#6366f1" stroke-width="1.5"/>
    <path d="M20 15 L20 45 L50 30 L50 0 Z" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <path d="M0 30 L0 60 L30 45 L30 30 Z" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
    <path d="M30 30 L50 15 L50 45 L30 60 Z" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  </g>
  <!-- Coffee cup -->
  <rect x="350" y="250" width="30" height="25" rx="4" fill="#2a2a3e" stroke="#6366f1" stroke-width="1"/>
  <path d="M380 258 Q390 258 390 268 Q390 275 380 275" fill="none" stroke="#6366f1" stroke-width="1.5"/>
</svg>
