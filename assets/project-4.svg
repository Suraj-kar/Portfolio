<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="p4bg" x1="0" y1="0" x2="600" y2="400">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p4bg)"/>
  <!-- Phone frame -->
  <rect x="210" y="30" width="180" height="340" rx="28" fill="url(#phoneGrad)" stroke="#6366f1" stroke-width="2"/>
  <rect x="260" y="50" width="80" height="6" rx="3" fill="#2a2a3e"/>
  <!-- App screen -->
  <rect x="220" y="70" width="160" height="280" rx="4" fill="#0a0a0f"/>
  <!-- Header -->
  <rect x="230" y="80" width="80" height="8" rx="4" fill="#10b981" opacity="0.7"/>
  <rect x="230" y="95" width="120" height="5" rx="2" fill="#4a4a5a"/>
  <!-- Activity ring -->
  <circle cx="300" cy="170" r="50" fill="none" stroke="#1a1a25" stroke-width="8"/>
  <circle cx="300" cy="170" r="50" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="220 94" stroke-linecap="round" transform="rotate(-90 300 170)"/>
  <circle cx="300" cy="170" r="35" fill="none" stroke="#1a1a25" stroke-width="6"/>
  <circle cx="300" cy="170" r="35" fill="none" stroke="#6366f1" stroke-width="6" stroke-dasharray="150 70" stroke-linecap="round" transform="rotate(-90 300 170)"/>
  <text x="300" y="175" text-anchor="middle" fill="#f0f0f5" font-size="16" font-weight="700" font-family="Inter, sans-serif">7.2k</text>
  <!-- Stats row -->
  <rect x="235" y="240" width="55" height="40" rx="8" fill="#1a1a25"/>
  <rect x="245" y="250" width="35" height="4" rx="2" fill="#10b981" opacity="0.6"/>
  <rect x="245" y="260" width="25" height="10" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="300" y="240" width="55" height="40" rx="8" fill="#1a1a25"/>
  <rect x="310" y="250" width="35" height="4" rx="2" fill="#6366f1" opacity="0.6"/>
  <rect x="310" y="260" width="25" height="10" rx="2" fill="#8b5cf6" opacity="0.3"/>
  <!-- Bottom nav -->
  <rect x="230" y="310" width="140" height="30" rx="8" fill="#1a1a25"/>
  <circle cx="260" cy="325" r="6" fill="#10b981" opacity="0.7"/>
  <circle cx="300" cy="325" r="6" fill="#4a4a5a"/>
  <circle cx="340" cy="325" r="6" fill="#4a4a5a"/>
  <!-- Side phone (smaller) -->
  <rect x="430" y="100" width="120" height="220" rx="18" fill="url(#phoneGrad)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" opacity="0.6"/>
  <rect x="440" y="120" width="100" height="180" rx="3" fill="#0a0a0f" opacity="0.6"/>
  <!-- Left phone (smaller) -->
  <rect x="50" y="100" width="120" height="220" rx="18" fill="url(#phoneGrad)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5" opacity="0.6"/>
  <rect x="60" y="120" width="100" height="180" rx="3" fill="#0a0a0f" opacity="0.6"/>
</svg>
