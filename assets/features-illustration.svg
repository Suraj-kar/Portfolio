<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="500" y2="500">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#fbg)"/>
  <!-- Central performance ring -->
  <circle cx="250" cy="220" r="100" fill="none" stroke="#1a1a25" stroke-width="12"/>
  <circle cx="250" cy="220" r="100" fill="none" stroke="url(#ring)" stroke-width="12" stroke-dasharray="500 130" stroke-linecap="round" transform="rotate(-90 250 220)"/>
  <text x="250" y="215" text-anchor="middle" fill="#f0f0f5" font-size="36" font-weight="800" font-family="Inter, sans-serif">98</text>
  <text x="250" y="240" text-anchor="middle" fill="#a0a0b0" font-size="12" font-family="Inter, sans-serif">Performance Score</text>
  <!-- Metric cards around -->
  <g transform="translate(60, 80)">
    <rect width="100" height="60" rx="12" fill="#1a1a25" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
    <text x="50" y="30" text-anchor="middle" fill="#6366f1" font-size="18" font-weight="700" font-family="Inter, sans-serif">A+</text>
    <text x="50" y="48" text-anchor="middle" fill="#6b6b7b" font-size="9" font-family="Inter, sans-serif">Accessibility</text>
  </g>
  <g transform="translate(340, 80)">
    <rect width="100" height="60" rx="12" fill="#1a1a25" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
    <text x="50" y="30" text-anchor="middle" fill="#06b6d4" font-size="18" font-weight="700" font-family="Inter, sans-serif">0.8s</text>
    <text x="50" y="48" text-anchor="middle" fill="#6b6b7b" font-size="9" font-family="Inter, sans-serif">Load Time</text>
  </g>
  <g transform="translate(60, 340)">
    <rect width="100" height="60" rx="12" fill="#1a1a25" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
    <text x="50" y="30" text-anchor="middle" fill="#8b5cf6" font-size="18" font-weight="700" font-family="Inter, sans-serif">100</text>
    <text x="50" y="48" text-anchor="middle" fill="#6b6b7b" font-size="9" font-family="Inter, sans-serif">SEO Score</text>
  </g>
  <g transform="translate(340, 340)">
    <rect width="100" height="60" rx="12" fill="#1a1a25" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
    <text x="50" y="30" text-anchor="middle" fill="#10b981" font-size="18" font-weight="700" font-family="Inter, sans-serif">99.9%</text>
    <text x="50" y="48" text-anchor="middle" fill="#6b6b7b" font-size="9" font-family="Inter, sans-serif">Uptime</text>
  </g>
  <!-- Connection lines -->
  <line x1="160" y1="110" x2="200" y2="170" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>
  <line x1="340" y1="110" x2="300" y2="170" stroke="#06b6d4" stroke-width="0.5" opacity="0.2"/>
  <line x1="160" y1="370" x2="200" y2="270" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>
  <line x1="340" y1="370" x2="300" y2="270" stroke="#10b981" stroke-width="0.5" opacity="0.2"/>
  <!-- Bottom bar chart -->
  <g transform="translate(150, 400)">
    <rect x="0" y="20" width="20" height="40" rx="3" fill="#6366f1" opacity="0.5"/>
    <rect x="30" y="10" width="20" height="50" rx="3" fill="#8b5cf6" opacity="0.5"/>
    <rect x="60" y="5" width="20" height="55" rx="3" fill="#06b6d4" opacity="0.5"/>
    <rect x="90" y="15" width="20" height="45" rx="3" fill="#6366f1" opacity="0.4"/>
    <rect x="120" y="0" width="20" height="60" rx="3" fill="#10b981" opacity="0.5"/>
    <rect x="150" y="8" width="20" height="52" rx="3" fill="#8b5cf6" opacity="0.4"/>
    <rect x="180" y="12" width="20" height="48" rx="3" fill="#06b6d4" opacity="0.4"/>
  </g>
</svg>
